<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Administration | ELOU BUSINESS</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f5f5;color:#171717;font-family:Arial,sans-serif}
header{background:#111;color:white;padding:22px;text-align:center}
header h1{margin:0;font-size:22px;letter-spacing:2px}
header p{font-size:12px;color:#ccc}
main{max-width:850px;margin:25px auto;padding:15px}
.box{background:white;padding:22px;margin-bottom:20px;border-radius:10px}
h2{font-size:18px;margin-top:0}
input,button{width:100%;padding:12px;margin:7px 0;border:1px solid #ddd;border-radius:5px;font-size:15px}
button{background:#111;color:white;border:0;cursor:pointer;font-weight:bold}
button.danger{background:#b42318}
button.secondary{background:#555}
.product{border:1px solid #ddd;padding:12px;margin:12px 0;border-radius:7px;overflow-wrap:anywhere}
.product img{width:90px;height:90px;object-fit:cover;display:block;margin-bottom:8px}
#status{padding:10px;font-size:14px;overflow-wrap:anywhere}
.hidden{display:none}
label{font-size:13px;font-weight:bold;display:block;margin-top:10px}
</style>
</head>
<body>
<header>
<h1>ELOU BUSINESS</h1>
<p>ESPACE DE GESTION DES PRODUITS</p>
</header>
<main>
<div class="box" id="loginBox">
<h2>Connexion administrateur</h2>
<p>Connecte-toi avec ton compte Supabase.</p>
<input id="email" type="email" placeholder="Adresse e-mail">
<input id="password" type="password" placeholder="Mot de passe">
<button onclick="login()">Se connecter</button>
</div>
<div id="adminBox" class="hidden">
<div class="box">
<h2>Ajouter ou modifier un produit</h2>
<label>Nom du produit</label>
<input id="name" placeholder="Ex. T-shirt slim fit uni">
<label>Couleur</label>
<input id="color" placeholder="Ex. Noir">
<label>Code couleur</label>
<input id="hex" type="color" value="#151515">
<label>Prix en FCFA</label>
<input id="price" type="number" value="2500">
<label>Photo du produit</label>
<input id="imageFile" type="file" accept="image/*">
<button onclick="saveProduct()">Enregistrer le produit</button>
<button class="secondary" onclick="resetForm()">Annuler la modification</button>
<p id="status"></p>
</div>
<div class="box">
<h2>Produits enregistrés</h2>
<button onclick="loadProducts()">Actualiser la liste</button>
<div id="products"></div>
</div>
<button class="danger" onclick="logout()">Se déconnecter</button>
</div>
</main>
<script>
const SUPABASE_URL = 'https://zmcvfbbugzwazopyowlb.supabase.co';
const SUPABASE_KEY = 'sb_publishable_-6JQ2crbIkPYlJK0MYpWKw_fRCs-AVU';
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let editingId = null;
let currentImage = '';
function message(text){
document.getElementById('status').textContent = text;
}
async function login(){
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const {error} = await db.auth.signInWithPassword({email,password});
  if(error){
    alert("Connexion impossible : " + error.message);
    return;
  }
  showAdmin();
}
async function showAdmin(){
  const {data} = await db.auth.getSession();
  if(!data.session) return;
  document.getElementById('loginBox').classList.add('hidden');
  document.getElementById('adminBox').classList.remove('hidden');
  await loadProducts();
}
async function logout(){
  await db.auth.signOut();
  document.getElementById('adminBox').classList.add('hidden');
  document.getElementById('loginBox').classList.remove('hidden');
}
async function loadProducts(){
  const container = document.getElementById('products');
  container.innerHTML = 'Chargement...';
  const {data,error} = await db
    .from('products')
    .select('*')
    .order('id',{ascending:false});
  if(error){
    container.textContent = "Erreur : " + error.message;
    return;
  }
  container.innerHTML = '';
  if(!data.length){
    container.textContent = 'Aucun produit enregistré pour le moment.';
    return;
  }
  data.forEach(p => {
    const div = document.createElement('div');
    div.className = 'product';
    if(p.image){
      const img = document.createElement('img');
      img.src = p.image;
      img.alt = p.name || 'Produit';
      div.appendChild(img);
    }
    const title = document.createElement('strong');
    title.textContent = p.name || 'Sans nom';
    div.appendChild(title);
    const details = document.createElement('p');
    details.textContent =
      (p.category || 'Sans couleur') + ' — ' +
      Number(p.price || 0).toLocaleString('fr-FR') + ' FCFA';
    div.appendChild(details);
    const edit = document.createElement('button');
    edit.textContent = 'Modifier';
    edit.onclick = () => editProduct(p);
    div.appendChild(edit);
    const del = document.createElement('button');
    del.textContent = 'Supprimer';
    del.className = 'danger';
    del.onclick = () => deleteProduct(p.id);
    div.appendChild(del);
    container.appendChild(div);
  });
}
function editProduct(p){
  editingId = p.id;
  currentImage = p.image || '';
  document.getElementById('name').value = p.name || '';
  document.getElementById('color').value = p.category || '';
  document.getElementById('hex').value = p.hex || '#151515';
  document.getElementById('price').value = p.price || 2500;
  document.getElementById('imageFile').value = '';
  message('Modification du produit : ' + p.name);
  window.scrollTo({top:0,behavior:'smooth'});
}
function resetForm(){
  editingId = null;
  currentImage = '';
  document.getElementById('name').value = '';
  document.getElementById('color').value = '';
  document.getElementById('hex').value = '#151515';
  document.getElementById('price').value = '2500';
  document.getElementById('imageFile').value = '';
  message('');
}
async function saveProduct(){
  const name = document.getElementById('name').value.trim();
  const color = document.getElementById('color').value.trim();
  const price = Number(document.getElementById('price').value);
  const hex = document.getElementById('hex').value;
  if(!name || !color || !price || price < 1){
    alert('Remplis le nom, la couleur et le prix.');
    return;
  }
  const file = document.getElementById('imageFile').files[0];
  if(file){
    if(file.size > 2 * 1024 * 1024){
      alert('La photo doit faire moins de 2 Mo.');
      return;
    }
    currentImage = await new Promise((resolve,reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }
  message('Enregistrement en cours...');
  const product = {
    name,
    category: color,
    price,
    hex,
    image: currentImage
  };
  let result;
  if(editingId !== null){
    result = await db
      .from('products')
      .update(product)
      .eq('id',editingId);
  }else{
    result = await db
      .from('products')
      .insert([product]);
  }
  if(result.error){
    message('Erreur : ' + result.error.message);
    return;
  }
  message('Produit enregistré avec succès !');
  resetForm();
  await loadProducts();
}
async function deleteProduct(id){
  if(!confirm('Veux-tu vraiment supprimer ce produit ?')) return;
  const {error} = await db
    .from('products')
    .delete()
    .eq('id',id);
  if(error){
    alert('Erreur : ' + error.message);
    return;
  }
  await loadProducts();
}
db.auth.onAuthStateChange((event,session) => {
  if(session){
    showAdmin();
  }
});
showAdmin();
</script>
</body>
</html>
